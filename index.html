<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رواق — تصميم الغرف الذكي</title><style>:root{font-family:system-ui,sans-serif;color:#33271f;background:#f8f4ed}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:#2b2118;color:#fff;border-radius:28px;padding:42px;display:grid;gap:22px}.hero h1{font-size:clamp(32px,6vw,64px);margin:0}.hero p{font-size:18px;line-height:1.9;color:#eadfce;max-width:650px}.actions{display:flex;gap:12px;flex-wrap:wrap}button,input{font:inherit;border-radius:14px;padding:12px 16px;border:1px solid #d8c8b4}button{cursor:pointer;background:#d9b26a;color:#2b2118;font-weight:700;border:0}button.secondary{background:#fff}.panel{background:#fff;border-radius:22px;padding:22px;margin-top:22px;box-shadow:0 8px 30px #4c32140d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{border:1px solid #eadfce;border-radius:18px;padding:14px}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#eee}.muted{color:#786b5f}.status{margin-top:12px;min-height:24px}.hidden{display:none}label{display:block;margin:8px 0;font-weight:700}</style></head><body><main class="wrap"><section class="hero"><div><small>رواق · RIWAQ</small><h1>صمّم غرفتك<br>قبل ما تشتري.</h1><p>استكشف الأثاث، ابحث حسب ميزانيتك، وجرّب القطعة داخل غرفتك بتجربة بسيطة وسريعة.</p></div><div class="actions"><button id="browse">استكشف الأثاث</button><button class="secondary" id="connect">ربط Supabase</button><button class="secondary" id="generate">تجربة التوليد</button></div></section><section class="panel"><h2>قطع مختارة</h2><div id="status" class="status muted">اضغط «استكشف الأثاث» لعرض المنتجات.</div><div id="grid" class="grid"></div></section><section id="settings" class="panel hidden"><h2>إعداد الاتصال</h2><label>رابط Supabase<input id="url" value="https://bsfjukhbpurhnlqksstf.supabase.co" style="width:100%"></label><label>مفتاح anon العام<input id="key" type="password" placeholder="ضع مفتاح anon هنا" style="width:100%"></label><button id="save">حفظ وتجربة الاتصال</button></section></main><script>const $=id=>document.getElementById(id),status=$("status");const fallback=[["ai-sofa.png","أريكة نهرين","أثاث المنصور"],["ai-chair.png","كرسي زمردي مفرد","دار الرافدين"],["ai-table.png","طاولة خشب طبيعية","بيت الخيزران"]];function render(rows){$("grid").innerHTML=rows.map(r=>`<article class="card"><img src="${r.img||r.primary_image_url||"ai-room-1.png"}" alt=""><b>${r.name||r.name_ar||"قطعة أثاث"}</b><p class="muted">${r.co||r.company_name||""}</p>${r.price_iqd?`<strong>${Number(r.price_iqd).toLocaleString("ar-IQ")} د.ع</strong>`:""}</article>`).join("")}async function browse(){status.textContent="جارٍ تحميل الأثاث…";const url=localStorage.rqUrl||"",key=localStorage.rqKey||"";if(!url||!key){render(fallback.map(([img,name,co])=>({img,name,co})));status.textContent="عرض تجريبي. اربط Supabase لعرض الكتالوج الحقيقي.";return}try{const r=await fetch(url+"/rest/v1/rpc/search_furniture",{method:"POST",headers:{apikey:key,Authorization:"Bearer "+key,"content-type":"application/json"},body:JSON.stringify({q:null,p_limit:12})});if(!r.ok)throw Error("تعذر الاتصال");render(await r.json());status.textContent="تم تحميل الكتالوج من Supabase."}catch(e){status.textContent="تعذر الاتصال، عُرضت القطع التجريبية.";render(fallback.map(([img,name,co])=>({img,name,co})))}}$("browse").onclick=browse;$("connect").onclick=()=>$("settings").classList.toggle("hidden");$("save").onclick=()=>{localStorage.rqUrl=$("url").value.trim();localStorage.rqKey=$("key").value.trim();status.textContent="تم حفظ الإعدادات.";browse()};$("generate").onclick=()=>status.textContent="التوليد يحتاج مفتاح Gemini داخل خادم آمن، ويمكن ربطه بعد إعداد Edge Function.";</script></body></html>
